name: fxrates

services:
  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fxrates}
      POSTGRES_USER: ${POSTGRES_USER:-fxrates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fxrates}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.19.1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./migrations
        target: /migrations
        read_only: true
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-fxrates}:${POSTGRES_PASSWORD:-fxrates}@db:5432/${POSTGRES_DB:-fxrates}?sslmode=disable
      - up

  app:
    image: fxrates:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-fxrates}:${POSTGRES_PASSWORD:-fxrates}@db:5432/${POSTGRES_DB:-fxrates}?sslmode=disable
      DATABASE_TIMEOUT: ${DATABASE_TIMEOUT:-5s}
      DATABASE_QUERY_TIMEOUT: ${DATABASE_QUERY_TIMEOUT:-3s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL:-https://api.frankfurter.dev}
      FRANKFURTER_TIMEOUT: ${FRANKFURTER_TIMEOUT:-5s}
      FRANKFURTER_MAX_ATTEMPTS: ${FRANKFURTER_MAX_ATTEMPTS:-3}
      FRANKFURTER_RETRY_DELAY: ${FRANKFURTER_RETRY_DELAY:-250ms}
      FRANKFURTER_RETRY_MAX_DELAY: ${FRANKFURTER_RETRY_MAX_DELAY:-5s}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-500ms}
      RECOVERY_INTERVAL: ${RECOVERY_INTERVAL:-10s}
      PROCESSING_TIMEOUT: ${PROCESSING_TIMEOUT:-30s}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
