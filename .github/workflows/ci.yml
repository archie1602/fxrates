name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Validate OpenAPI
        run: >-
          npx --yes @redocly/cli@2.46.0 lint openapi.yaml
          --skip-rule info-license-strict
          --skip-rule no-server-example.com

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -race ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Check vulnerabilities
        run: govulncheck ./...

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: fxrates_test
          POSTGRES_USER: fxrates
          POSTGRES_PASSWORD: fxrates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fxrates -d fxrates_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://fxrates:fxrates@localhost:5432/fxrates_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install migrate
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Verify migration rollback
        run: |
          migrate -path migrations -database "$TEST_DATABASE_URL" up
          migrate -path migrations -database "$TEST_DATABASE_URL" down -all

      - name: PostgreSQL integration tests
        run: make test-integration
